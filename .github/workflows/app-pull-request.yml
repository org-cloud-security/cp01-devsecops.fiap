name: app-pull-request

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"

jobs:
  sast-semgrep:
    name: "sast-semgrep"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: semgrep-scan
        run:  semgrep scan --config auto --text-output=semgrep.txt app

      - name: upload-report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep.txt

  sca-owasp-deps-check:
    name: "sca-owasp-deps-check"
    runs-on: ubuntu-latest

    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: dependency-check-scan
        run:  app/scripts/dependency-check.sh
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: upload-report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: dependency-check-report.html

  app-docker-build:

    name: "app-docker-build"
    runs-on: ubuntu-latest
    needs:
      - sast-semgrep
      - sca-owasp-deps-check

    defaults:
      run:
        working-directory: app

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-build
        run:  docker build -t app .
