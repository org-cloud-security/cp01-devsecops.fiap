name: app-pull-request

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"

jobs:
  sast-semgrep:
    name: "sast-semgrep"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    permissions:
      security-events: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: semgrep-scan
        run:  semgrep scan --config auto --text-output=semgrep.txt --sarif-output=semgrep.sarif app

      - name: upload-report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep.txt

      - name: upload-sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  app-docker-build:

    name: "app-docker-build"
    runs-on: ubuntu-latest
    needs:
      - sast-semgrep

    defaults:
      run:
        working-directory: app

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-build
        run:  docker build -t app .
