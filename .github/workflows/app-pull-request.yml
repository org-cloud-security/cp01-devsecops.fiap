name: app-pull-request

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"

jobs:
  sast-semgrep:
    name: "sast-semgrep"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: semgrep-scan
        run:  semgrep scan --config auto app

  sca-owasp-dependency-check:
    name: "sca-owasp-dependency-check"
    runs-on: ubuntu-latest
    container:
      image: owasp/dependency-check

    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: dependency-check-scan
        run:  /usr/share/dependency-check/bin/dependency-check.sh --scan app --project app --format HTML --failOnCVSS 7 --nvdApiKey ${{ secrets.NVD_API_KEY }}

  app-docker-build:

    name: "app-docker-build"
    runs-on: ubuntu-latest
    needs:
      - sast-semgrep
      - sca-owasp-dependency-check

    defaults:
      run:
        working-directory: app

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-build
        run:  docker build -t app .
