name: lab

on: pull_request

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm checkov
        working-directory: lab

  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d app
        working-directory: lab
      # volume anonimo no lugar do bind mount: aqui interessa o gate, nao o relatorio
      - run: docker compose run --rm -v /zap/wrk zap
        working-directory: lab
